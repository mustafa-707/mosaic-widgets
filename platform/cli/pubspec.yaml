name: mosaic_cli
description: "Command-line tool to scaffold, generate, and manage native home widgets for the Mosaic framework."
version: 0.1.0
repository: https://github.com/mustafa-707/mosaic-widgets
homepage: https://github.com/mustafa-707/mosaic-widgets
issue_tracker: https://github.com/mustafa-707/mosaic-widgets/issues
documentation: https://github.com/mustafa-707/mosaic-widgets#readme
topics:
  - home-widget
  - cli
  - code-generation
  - widget

environment:
  sdk: ">=3.0.0 <4.0.0"

# Add regular dependencies here.
dependencies:
  args: ^2.4.2
  yaml: ^3.1.2
  mosaic_core: ^0.1.0
  mosaic_android: ^0.1.0
  mosaic_ios: ^0.1.0
  path: ^1.8.3

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
