name: mosaic_widgets
description: "Build native iOS and Android home-screen widgets, lock-screen widgets, and Live Activities from a single Flutter-style Dart DSL."
publish_to: none
version: 1.0.0
repository: https://github.com/mustafa-707/mosaic-widgets
homepage: https://github.com/mustafa-707/mosaic-widgets
issue_tracker: https://github.com/mustafa-707/mosaic-widgets/issues
documentation: https://github.com/mustafa-707/mosaic-widgets#readme
topics:
  - home-widget
  - widget
  - ios
  - android
  - live-activities

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  mosaic_core:
    path: ../core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

